[project]
name = "radar-anti-impayes"
version = "0.1.0"
description = "Score de risque de défaillance d'une entreprise à partir des données ouvertes (BODACC, INPI)."
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "pyarrow>=15",
  "duckdb>=1.0",
  "httpx>=0.27",
  "pyyaml>=6",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "shap>=0.45",
  "joblib>=1.4",
  "fastapi>=0.115",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]



[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
