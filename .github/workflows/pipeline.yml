name: Pipeline données réelles

# Ingestion des données ouvertes + entraînement.
# Déclencheurs : chaque lundi, à la demande, ou en modifiant .github/pipeline-trigger.
# Les journaux et métriques sont publiés sur la branche « pipeline-results »,
# pour pouvoir être relus sans accès à l'interface GitHub.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 5 * * 1"
  push:
    branches: [main]
    paths: [".github/pipeline-trigger"]

permissions:
  contents: write

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: mkdir -p reports

      - name: Vérifier le schéma des sources
        id: inspect
        run: set -o pipefail; python -m radar inspect 2>&1 | tee reports/1-inspect.log

      - name: Télécharger BODACC et ratios INPI
        id: ingest
        if: steps.inspect.outcome == 'success'
        run: set -o pipefail; python -m radar ingest 2>&1 | tee reports/2-ingest.log

      - name: Normaliser
        id: build
        if: steps.ingest.outcome == 'success'
        run: set -o pipefail; python -m radar build 2>&1 | tee reports/3-build.log

      - name: Entraîner et évaluer
        id: train
        if: steps.build.outcome == 'success'
        run: |
          set -o pipefail
          python -m radar train 2>&1 | tee reports/4-train.log
          cp models/metrics.json reports/metrics.json

      - name: Résumé des métriques
        id: summary
        if: steps.train.outcome == 'success'
        run: |
          echo '## Métriques du modèle' >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat models/metrics.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Sauvegarder le modèle
        id: upload
        uses: actions/upload-artifact@v4
        if: steps.train.outcome == 'success'
        with:
          name: modele-et-base
          path: |
            models/
            data/radar.duckdb
          retention-days: 30

      - name: Corpus juridique officiel (export LEGI de Légifrance)
        id: corpus
        continue-on-error: true
        run: set -o pipefail; python -m radar corpus 2>&1 | tee reports/5-corpus.log

      - name: Évaluer l'assistant (recherche + 10 réponses générées)
        id: rageval
        if: steps.corpus.outcome == 'success'
        continue-on-error: true
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          set -o pipefail
          python -m radar eval-rag --generation 10 2>&1 | tee reports/6-rag-eval.log
          cp models/rag_eval.json reports/rag_eval.json

      - name: Préparer le paquet de service (base allégée + modèle)
        id: export
        if: steps.train.outcome == 'success'
        run: set -o pipefail; python -m radar export --out dist 2>&1 | tee reports/7-export.log

      - name: Publier le paquet dans la release « modele »
        id: release
        if: steps.export.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view modele >/dev/null 2>&1 || gh release create modele \
            --title "Modèle et base de service" \
            --notes "Publié automatiquement par le pipeline hebdomadaire. Utilisé au build de l'image Docker."
          gh release upload modele dist/acquit-serve.tar.gz --clobber
          # Redéploie le site si un « deploy hook » Render est configuré (secret facultatif)
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then curl -fsS -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}" >/dev/null; fi

      - name: Publier les journaux sur la branche pipeline-results
        # En dernier, dans un dossier séparé : ne touche pas au dossier de travail
        if: always()
        env:
          TOKEN: ${{ github.token }}
        run: |
          {
            echo "run: ${GITHUB_RUN_ID}"
            echo "date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "commit: ${GITHUB_SHA}"
            echo "inspect: ${{ steps.inspect.outcome }}"
            echo "ingest: ${{ steps.ingest.outcome }}"
            echo "build: ${{ steps.build.outcome }}"
            echo "train: ${{ steps.train.outcome }}"
            echo "summary: ${{ steps.summary.outcome }}"
            echo "upload: ${{ steps.upload.outcome }}"
            echo "corpus: ${{ steps.corpus.outcome }}"
            echo "rageval: ${{ steps.rageval.outcome }}"
            echo "export: ${{ steps.export.outcome }}"
            echo "release: ${{ steps.release.outcome }}"
            df -h / | tail -1
            free -m | sed -n 2p
          } > reports/0-status.txt
          mkdir -p /tmp/results && cp -r reports/. /tmp/results/
          cd /tmp/results
          git init -q -b pipeline-results
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Résultats du run ${GITHUB_RUN_ID}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" pipeline-results
