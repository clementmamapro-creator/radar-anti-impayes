name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Tests (données synthétiques, sans réseau)
        run: pytest -q
      - name: Build de l'image Docker
        run: docker build -t radar-anti-impayes .
