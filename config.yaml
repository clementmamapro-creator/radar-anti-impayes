# Configuration du Radar anti-impayés (phase 1 : radar client)
#
# Les noms de colonnes des jeux open data ne sont pas documentés de façon stable.
# Lancez `python -m radar inspect` au premier démarrage : la commande affiche les
# vraies colonnes et signale celles du mapping ci-dessous qui sont introuvables.

paths:
  raw_dir: data/raw
  db: data/radar.duckdb
  model_dir: models

sources:
  bodacc:
    # Annonces commerciales du BODACC (DILA), plateforme Opendatasoft
    base_url: https://bodacc-datadila.opendatasoft.com/api/explore/v2.1
    dataset: annonces-commerciales
    # On ne télécharge que les procédures collectives
    where: "familleavis='collective'"
    columns:
      registre: registre          # SIREN (parfois "123 456 789", parfois liste)
      date_parution: dateparution
      famille: familleavis_lib
      jugement: jugement          # JSON texte : nature et date du jugement
  ratios:
    # Ratios financiers BCE / INPI (DGE), plateforme Opendatasoft
    base_url: https://data.economie.gouv.fr/api/explore/v2.1
    dataset: ratios_inpi_bce
    columns:
      siren: siren
      date_cloture: date_cloture_exercice
      type_bilan: type_bilan
    # Ratios utilisés comme variables explicatives (renommés côté modèle)
    features:
      chiffre_affaires: chiffre_d_affaires
      marge_ebe: marge_ebe
      resultat_net: resultat_net
      taux_endettement: taux_d_endettement
      ratio_liquidite: ratio_de_liquidite
      autonomie_financiere: autonomie_financiere
      caf_sur_ca: caf_sur_ca
      capacite_remboursement: capacite_de_remboursement
      couverture_interets: couverture_des_interets
      credit_clients_jours: credit_clients_jours
      credit_fournisseurs_jours: credit_fournisseurs_jours
      poids_bfr_sur_ca: poids_bfr_exploitation_sur_ca
  entreprises:
    # API Recherche d'entreprises (identité, utilisée au moment du scoring)
    base_url: https://recherche-entreprises.api.gouv.fr

target:
  # Délai entre la clôture des comptes et le moment où ils sont réellement
  # disponibles (dépôt au greffe). Les variables ne sont utilisées qu'à partir
  # de cette date d'observation, pour éviter toute fuite d'information.
  observation_lag_months: 7
  # Horizon de prédiction : procédure collective ouverte dans les N mois
  horizon_months: 12
  # Mots-clés identifiant un jugement d'ouverture de procédure
  opening_keywords: ["ouverture", "redressement", "liquidation", "sauvegarde"]

model:
  # Découpage temporel : on entraîne sur les années d'observation passées
  # et on teste sur la ou les années suivantes.
  test_years: 1
  random_state: 42
  # Seuils de niveau de risque appliqués à la probabilité calibrée
  levels:
    faible: 0.02
    modere: 0.06
    eleve: 1.0

# Assistant « impayés » (RAG juridique sourcé)
rag:
  # Source officielle : export open data LEGI de la DILA (Légifrance), Licence Ouverte
  legi_index: https://echanges.dila.gouv.fr/OPENDATA/LEGI/
  corpus: data/corpus.jsonl
  # Articles retenus, par code. Version en vigueur uniquement.
  articles:
    LEGITEXT000005634379:   # Code de commerce
      nom: Code de commerce
      nums: [L110-4, L441-9, L441-10, L441-11, L441-16, D441-5, L622-24, L622-26, R622-24, L631-14, L641-3]
    LEGITEXT000006070721:   # Code civil
      nom: Code civil
      nums: ["1231-6", "1231-7", "1343-5", "1344", "1344-1", "1352-7", "2224", "1103", "1217", "1219"]
    LEGITEXT000006070716:   # Code de procédure civile
      nom: Code de procédure civile
      nums: ["1405", "1406", "1407", "1408", "1409", "1410", "1411", "1412", "1416", "1422", "1424"]
    LEGITEXT000025024948:   # Code des procédures civiles d'exécution
      nom: Code des procédures civiles d'exécution
      nums: [L125-1, R125-1, L111-3]
  retrieval_k: 5
  model: claude-haiku-5-5
  max_tokens: 1500
  free_daily_quota: 3
  # Thèmes éditoriaux : décrivent chaque article dans les mots des TPE (enrichissement de l'index)
  themes:
    L110-4: prescription délai pour agir réclamer une facture entre commerçants cinq ans
    L441-9: facture mentions obligatoires date d'échéance pénalités indemnité forfaitaire bon de commande
    L441-10: délai de paiement maximum soixante jours quarante-cinq jours fin de mois trente jours pénalités de retard taux BCE indemnité forfaitaire
    L441-11: délais de paiement dérogatoires par secteur transport alcool accords interprofessionnels
    L441-16: amende administrative non-respect des délais de paiement sanction DGCCRF
    D441-5: montant de l'indemnité forfaitaire frais de recouvrement quarante euros
    L622-24: déclaration de créance procédure collective sauvegarde redressement mandataire judiciaire
    L622-26: forclusion créance non déclarée relevé de forclusion délai dépassé
    R622-24: délai de déclaration des créances deux mois publication BODACC jugement d'ouverture
    L631-14: redressement judiciaire application des règles de la sauvegarde aux créanciers
    L641-3: liquidation judiciaire effets déclaration des créances liquidateur
    "1103": force obligatoire du contrat devis signé engagement
    "1217": inexécution du contrat recours exécution forcée réduction du prix résolution dommages et intérêts
    "1219": exception d'inexécution suspendre ses travaux refuser d'exécuter tant que l'autre ne paie pas
    "1231-6": intérêts moratoires taux légal retard de paiement à compter de la mise en demeure
    "1231-7": intérêts sur condamnation judiciaire
    "1343-5": délais de grâce report échelonnement échéancier accordé par le juge deux ans
    "1344": mise en demeure lettre de relance sommation
    "1344-1": mise en demeure fait courir les intérêts moratoires
    "1352-7": restitution de mauvaise foi intérêts
    "2224": prescription cinq ans action en paiement
    "1405": injonction de payer conditions créance contractuelle montant déterminé
    "1406": injonction de payer tribunal compétent domicile du débiteur
    "1407": requête en injonction de payer contenu pièces justificatives montant décompte
    "1408": injonction de payer renvoi en cas d'opposition
    "1409": décision du juge injonction de payer acceptation rejet partiel
    "1410": rejet de la requête en injonction de payer
    "1411": signification de l'ordonnance six mois caducité commissaire de justice
    "1412": opposition du débiteur contestation de l'injonction de payer
    "1416": délai d'opposition un mois après signification
    "1422": formule exécutoire demande après expiration du délai d'opposition
    L125-1: procédure simplifiée de recouvrement des petites créances commissaire de justice cinq mille euros
    R125-1: petites créances montant maximum modalités
    L111-3: titre exécutoire liste jugement injonction de payer
